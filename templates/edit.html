{% extends 'base.html' %}
{% block content %}
<h2>Редактирование записи</h2>
<form method="POST" action="/edit/{{ entry.id }}">
    <label>Заголовок:</label>
    <input type="text" name="title" value="{{ entry.title }}" required>
    <label>Текст:</label>
    <textarea name="content" rows="10" required>{{ entry.content }}</textarea>
    <button type="submit" style="background: #2ecc71;">Сохранить</button>
    <a href="/" style="margin-left: 15px; text-decoration: none;">Отмена</a>
</form>
{% endblock %}
